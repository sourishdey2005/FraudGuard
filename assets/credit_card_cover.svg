<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="FraudGuard — Credit Card Fraud Detection">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g opacity="0.06" stroke="#60a5fa" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="260"/>
    <line x1="300" y1="0" x2="300" y2="260"/>
    <line x1="450" y1="0" x2="450" y2="260"/>
    <line x1="600" y1="0" x2="600" y2="260"/>
    <line x1="750" y1="0" x2="750" y2="260"/>
  </g>

  <!-- Credit card -->
  <g filter="url(#shadow)">
    <rect x="290" y="40" width="320" height="200" rx="18" fill="url(#card)"/>
    <rect x="290" y="40" width="320" height="200" rx="18" fill="url(#shine)"/>
    <!-- Card border glow -->
    <rect x="290" y="40" width="320" height="200" rx="18" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- EMV chip -->
  <rect x="318" y="78" width="42" height="32" rx="6" fill="url(#chip)"/>
  <g stroke="#92400e" stroke-width="1" opacity="0.6">
    <line x1="318" y1="94" x2="360" y2="94"/>
    <line x1="339" y1="78" x2="339" y2="110"/>
  </g>

  <!-- Contactless icon -->
  <g transform="translate(490,94)" opacity="0.7" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round">
    <path d="M0,-12 A16,16 0 0 1 0,12"/>
    <path d="M6,-18 A24,24 0 0 1 6,18"/>
    <path d="M12,-24 A32,32 0 0 1 12,24"/>
  </g>

  <!-- Card number -->
  <text x="316" y="148" font-family="ui-monospace, 'Courier New', monospace" font-size="15" fill="#e2e8f0" letter-spacing="3">4532  ••••  ••••  8841</text>

  <!-- Cardholder -->
  <text x="316" y="186" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" letter-spacing="1.5">CARDHOLDER NAME</text>
  <text x="316" y="202" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#f1f5f9" font-weight="600">SOURISH DEY</text>

  <!-- Expiry -->
  <text x="490" y="186" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" letter-spacing="1.5">VALID THRU</text>
  <text x="490" y="202" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#f1f5f9" font-weight="600">12/28</text>

  <!-- Network logo -->
  <g transform="translate(560,78)">
    <circle cx="0" cy="0" r="12" fill="#eb001b" opacity="0.9"/>
    <circle cx="16" cy="0" r="12" fill="#f79e1b" opacity="0.9"/>
    <text x="8" y="26" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="1">MASTERCARD</text>
  </g>

  <!-- Left side title -->
  <g transform="translate(40, 95)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="800" fill="#f8fafc" letter-spacing="-1">FraudGuard</text>
    <text x="2" y="28" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#60a5fa" letter-spacing="3" font-weight="600">CREDIT CARD FRAUD DETECTION</text>
    <text x="2" y="52" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">Leak-free · Calibrated · Production-ready</text>
  </g>

  <!-- Right side badge -->
  <g transform="translate(700, 95)">
    <rect x="0" y="0" width="160" height="70" rx="10" fill="#0f172a" opacity="0.6" stroke="#334155" stroke-width="1"/>
    <text x="80" y="22" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="2">BEST MODEL</text>
    <text x="80" y="42" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="700">FraudFormer</text>
    <text x="80" y="60" font-family="ui-monospace, monospace" font-size="11" fill="#34d399" text-anchor="middle">PR-AUC 0.5330</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="256" width="900" height="4" fill="url(#shine)"/>
  <rect x="0" y="256" width="300" height="4" fill="#3b82f6"/>
  <rect x="300" y="256" width="300" height="4" fill="#8b5cf6"/>
  <rect x="600" y="256" width="300" height="4" fill="#10b981"/>
</svg>
